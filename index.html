<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meczownik – Twój dziennik piłkarski</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #101713;
      color: #f4f7f4;
      min-height: 100vh;
    }

    header {
      padding: 24px;
      border-bottom: 1px solid #29352d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #83e29b;
    }

    .tagline {
      color: #a5b2a8;
      font-size: 13px;
      margin-top: 5px;
    }

    main {
      width: min(1000px, 92%);
      margin: 35px auto;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #a5b2a8;
      margin-bottom: 28px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .card {
      background: #19231c;
      border: 1px solid #29382e;
      border-radius: 14px;
      padding: 20px;
    }

    .card p {
      color: #a5b2a8;
      font-size: 14px;
    }

    .number {
      font-size: 30px;
      color: #83e29b;
      font-weight: bold;
      margin-top: 12px;
    }

    h2 {
      margin-bottom: 18px;
      font-size: 21px;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }

    input, select, button {
      border-radius: 9px;
      padding: 13px;
      font-size: 15px;
    }

    input, select {
      background: #101713;
      border: 1px solid #35443a;
      color: white;
      width: 100%;
    }

    button {
      border: none;
      background: #83e29b;
      color: #102016;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #a2f2b4;
    }

    .form-button {
      grid-column: 1 / -1;
    }

    .training {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #29352d;
      gap: 12px;
    }

    .training strong {
      display: block;
      margin-bottom: 5px;
    }

    .training small {
      color: #a5b2a8;
    }

    .empty {
      color: #a5b2a8;
      padding: 15px 0;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }

      form {
        grid-template-columns: 1fr;
      }

      .form-button {
        grid-column: auto;
      }

      header {
        padding: 18px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div>
      <div class="logo">⚽ MECZOWNIK</div>
      <div class="tagline">Twój osobisty dziennik piłkarski</div>
    </div>
  </header>

  <main>

    <h1>Witaj w Meczowniku!</h1>
    <p class="subtitle">
      Planuj treningi, zapisuj postępy i kontroluj swoją aktywność.
    </p>

    <section class="stats">
      <div class="card">
        <p>Wszystkie treningi</p>
        <div class="number" id="trainingCount">0</div>
      </div>

      <div class="card">
        <p>Łączny czas treningów</p>
        <div class="number" id="totalTime">0 h</div>
      </div>

      <div class="card">
        <p>Rodzaj aktywności</p>
        <div class="number" id="activityCount">0</div>
      </div>
    </section>

    <section class="card">
      <h2>Dodaj trening</h2>

      <form id="trainingForm">
        <input
          type="date"
          id="trainingDate"
          required
        >

        <select id="trainingType">
          <option value="Trening drużynowy">Trening drużynowy</option>
          <option value="Trening indywidualny">Trening indywidualny</option>
          <option value="Mecz">Mecz</option>
          <option value="Siłownia">Siłownia</option>
        </select>

        <input
          type="number"
          id="trainingTime"
          placeholder="Czas trwania (minuty)"
          min="1"
          required
        >

        <input
          type="text"
          id="trainingNote"
          placeholder="Notatka (opcjonalnie)"
        >

        <button class="form-button" type="submit">
          + Dodaj aktywność
        </button>
      </form>
    </section>

    <section class="card" style="margin-top: 25px;">
      <h2>Ostatnie aktywności</h2>
      <div id="trainingList">
        <p class="empty">Nie masz jeszcze zapisanych treningów.</p>
      </div>
    </section>

  </main>

  <script>
    const form = document.getElementById("trainingForm");
    const list = document.getElementById("trainingList");

    let trainings = JSON.parse(
      localStorage.getItem("meczownikTrainings") || "[]"
    );

    function saveTrainings() {
      localStorage.setItem(
        "meczownikTrainings",
        JSON.stringify(trainings)
      );
    }

    function renderTrainings() {
      list.innerHTML = "";

      if (trainings.length === 0) {
        list.innerHTML =
          '<p class="empty">Nie masz jeszcze zapisanych treningów.</p>';
      }

      trainings.slice().reverse().forEach((training) => {
        const item = document.createElement("div");
        item.className = "training";

        const info = document.createElement("div");

        const name = document.createElement("strong");
        name.textContent = training.type;

        const details = document.createElement("small");
        details.textContent =
          training.date + " • " + training.minutes + " min";

        const note = document.createElement("small");
        note.textContent = training.note
          ? " • " + training.note
          : "";

        info.append(name, details, note);

        const remove = document.createElement("button");
        remove.textContent = "Usuń";
        remove.type = "button";

        remove.addEventListener("click", () => {
          trainings = trainings.filter(
            (entry) => entry.id !== training.id
          );

          saveTrainings();
          renderTrainings();
        });

        item.append(info, remove);
        list.append(item);
      });

      document.getElementById("trainingCount").textContent =
        trainings.length;

      const minutes = trainings.reduce(
        (sum, training) => sum + Number(training.minutes),
        0
      );

      document.getElementById("totalTime").textContent =
        (minutes / 60).toFixed(1) + " h";

      document.getElementById("activityCount").textContent =
        new Set(trainings.map((training) => training.type)).size;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const training = {
        id: Date.now(),
        date: document.getElementById("trainingDate").value,
        type: document.getElementById("trainingType").value,
        minutes: Number(
          document.getElementById("trainingTime").value
        ),
        note: document.getElementById("trainingNote").value
      };

      trainings.push(training);
      saveTrainings();
      renderTrainings();
      form.reset();
    });

    renderTrainings();
  </script>

</body>
</html>
